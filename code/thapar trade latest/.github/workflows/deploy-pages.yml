
name: Deploy Thapar Trade to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'code/thapar trade latest/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: code/thapar trade latest
        run: npm install

      - name: Build project
        working-directory: code/thapar trade latest
        run: PUBLIC_URL=/Thapar-Trade npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'code/thapar trade latest/build'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
