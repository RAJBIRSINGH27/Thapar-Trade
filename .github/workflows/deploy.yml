
name: Deploy Thapar Trade to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: "code/thapar trade latest"

      - name: Build React application
        run: npm run build
        working-directory: "code/thapar trade latest"
        env:
          PUBLIC_URL: /Thapar-Trade

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: "code/thapar trade latest/build"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
