
name: Deploy Thapar Trade to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: code/thapar trade latest
        run: npm install

      - name: Build React app
        working-directory: code/thapar trade latest
        run: npm run build
        env:
          PUBLIC_URL: /Thapar-Trade

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/thapar trade latest/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
